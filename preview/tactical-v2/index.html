 preloadPoses(){

   const path=assets.sprites?.[role]?.[pose];if(typeof path!=='string'||!path||this.preloadedPosePaths.has(path)||this.preloadImages.size>=64)continue;

 home(){const m=M().getMission('u03'),other=[m,M().getMission('u01'),M().getMission('u02')],completed=Object.keys(this.progress.completed||{}).length;return '<main class="shell" id="main-content"><div class="home-heading"><div><p class="eyebrow">WELCOME TO THE ACADEMY</p><h1>每一步，都有人同行。</h1><p>今天，也一起做出值得信任的選擇。</p></div><span class="home-date">'+ico('leaf')+' 13 場演訓 · '+completed+' 章本機學習紀錄</span></div><section class="hero-card" aria-labelledby="hero-title"><div class="hero-copy"><span class="tag">'+ico('spark')+' 全新三人小隊戰棋</span><h2 id="hero-title">把勇氣，<br>用在<span>守護彼此</span>。</h2><p>移動、掩護、救援。帶著你的夥伴，從第一場撤離行動開始。</p><div class="hero-actions">'+(this.savedSession?button('繼續上次 '+ico('arrow'),'continue','primary'):button('開始第一場 '+ico('arrow'),'briefing','primary','data-mission="u03"'))+button('探索章節','chapters','outline')+'</div></div><div class="hero-illustration">'+this.sceneArt('u01')+'<div class="hero-art-overlay"></div></div><div class="hero-squad" aria-hidden="true"><div class="hero-character">'+this.visual('scout')+'</div><div class="hero-character">'+this.visual('guardian')+'</div><div class="hero-character">'+this.visual('medic')+'</div></div><span class="hero-caption">'+ico('flag')+' 每回合一小步，每個人都重要</span></section><div class="home-lower"><section><div class="section-heading"><h2>'+ico('flag')+' 今日行動</h2><button class="text-button" type="button" data-action="chapters">全部 13 章 '+ico('arrow')+'</button></div><div class="mission-grid">'+other.map((m,i)=>this.missionCard(m,i)).join('')+'</div></section><aside class="squad-and-tip"><section class="squad-card"><div class="section-heading"><h2>你的晨光小隊</h2><small>3 / 3 就緒</small></div><div class="squad-list">'+roleOrder.map(role=>'<div class="squad-row"><div class="small-portrait">'+this.visual(role,true)+'</div><div><h3>'+escape(E().roles[role].name)+'</h3><p>'+escape(E().roles[role].title)+' · '+escape(R().roles[role].desc)+'</p></div><span class="squad-role">'+ico(R().roles[role].icon)+'</span></div>').join('')+'</div>'+bu  uiData(){if(this.uiCache?.state===this.state&&this.uiCache.selectedId===this.selectedId&&this.uiCache.mode===this.mode)return this.uiCache;const selected=this.selected,skills=selected?E().getSkills(this.state,selected.id):[],skill=skills.find(s=>s.id===this.mode),reachable=this.mode==='move'&&selected?E().reachable(this.state,selected.id):[],targets=[];if(skill?.available&&skill.target==='self'){targets.push({x:selected.x,y:selected.y});}else if(skill?.available){for(let y=0;y<this.mission.map.height;y++)for(let x=0;x<this.mission.map.width;x++){const p=E().preview(this.state,{type:'skill',unitId:selected.id,skillId:skill.id,x,y,revision:this.state.revision});if(p.ok)targets.push({x,y});}}const intents=E().enemyIntents(this.state),summary=E().summary(this.state);return this.uiCache={state:this.state,selectedId:this.selectedId,mode:this.mode,skills,skill,reachable,targets,intents,summary};}

 missionPresentation(m){const override={u06:{briefing:'北、南輪值點各需累計完成 3 次守點：讓一位可行動隊員站在該格，並維持到回合結束。同一人可持續守點，也可換人接替；不需要使用「任務互動」。完成兩點後，全隊撤回。',strategy:'先派兩人分守標記格，第三人支援。掩護可立即清除連續施技負荷，也能維持守點；換人接替是可選安排。'},u08:{strategy:'每箱各可完成一次任務互動；完成時，當時存活隊員各回復 1 能量（上限 3），不能重複補能。安排分頭取物與撤回。'},u13:{strategy:'三人分工建立聯絡線、救援與據實紀錄；留出撤離路線並保留技能能量，不必全殲。'}}[m.id]||{};return {briefing:override.briefing||m.briefing,strategy:override.strategy||m.strategy};}
 tutorialHints(m){const hold=(m.objects||[]).some(o=>o.kind==='hold'),rescue=(m.civilians||[]).length>0;return ['點一下隊員。每人每回合能移動一次、使用技能一次。','選藍綠色地格，再確認移動。移動和技能先後皆可。',hold?'讓隊員站在輪值格，維持到回合結束即可累計；不用任務互動，同一人可持續守點。':rescue?'點「救援」再選相鄰民眾；護送到撤離格就能交接。':'點「任務互動」再選相鄰或同格的節點。先完成前置條件，再由小隊接力累積進度。','三人都安排好後，結束回合。紅色虛線先告訴你敵方威脅。',hold?'兩點都累計完成 3 次後，存活隊員全回撤離格。掩護可以清除連續施技負荷。':rescue?'任務完成後，存活隊員都回撤離格。你不需要停用所有訓練機。':'所有節點完成後，存活隊員都回撤離格。任務面板會保留每個節點的進度與前置。'];}
 nodeProgress(state,compact=false){const objects=state?.objects||[];if(!objects.length)return '';if(compact)return '<span class="mobile-node-progress">'+objects.map(o=>'<span>'+escape(o.name)+' <b>'+o.progress+'/'+o.required+'</b>'+(o.complete?' ✓':'')+'</span>').join(' · ')+'</span>';return '<section class="node-progress" aria-label="任務節點細進度"><h3>節點進度</h3><ul>'+objects.map(o=>{const pending=(o.dependsOn||[]).filter(id=>!objects.find(n=>n.id===id)?.complete).map(id=>objects.find(n=>n.id===id)?.name||id);const help=o.complete?'此節點已完成':pending.length?'先完成：'+pending.join('、'):o.kind==='hold'?'站此格至回合結束，累計守點':'相鄰或同格使用「任務互動」';return '<li data-node-id="'+escape(o.id)+'" class="'+(o.complete?'node-done':pending.length?'node-blocked':'')+'"><div><strong>'+escape(o.name)+'</strong><span>'+coord(o)+' · <b>'+o.progress+'/'+o.required+'</b></span></div><p>'+escape(help)+'</p></li>';}).join('')+'</ul></section>';}
 resultResponsibility(summary){const civilians=this.state.civilians||[],objects=this.state.objects||[];if(civilians.length){const rescued=civilians.filter(c=>c.status==='evacuated').length;return '本次演訓 '+civilians.length+' 位民眾中，已交接 '+rescued+' 位、仍有 '+(civilians.length-rescued)+' 位未交接。抵達或交接的數字，還沒有證明哪些需求與接手責任？';}if(objects.some(o=>o.kind==='hold'))return '本次守點紀錄：'+objects.map(o=>o.name+' '+o.progress+'/'+o.required).join('、')+'。這些守點數字，還不能證明接替者已理解工作與負荷；哪些責任仍需核對？';if(objects.length){const done=objects.filter(o=>o.complete),pending=objects.filter(o=>!o.complete);return '演訓節點完成 '+done.length+'/'+objects.length+'。'+(pending.length?'尚待完成：'+pending.map(o=>o.name+' '+o.progress+'/'+o.required).join('、')+'。':'已完成：'+done.map(o=>o.name).join('、')+'。')+'亮燈或操作完成，還不能證明資料已被理解與接手；哪項責任仍待確認？';}return '本次演訓仍可行動的隊員有 '+summary.surviving+' 人。哪些需求與責任，還沒有被這個戰術指標證明？';}

  const role=this.selected?.role;if(command.type==='skill')this.voice.play(role,['strike','shot','suppress'].includes(command.skillId)?'attack':command.skillId==='rescue'?'rescue':'skill');

 confirmImport(){if(!this.pendingImport)return;this.flushDraft();const result=this.store.importJSON(this.pendingImport,{replaceExisting:true});if(!result.ok){this.toast(result.message);return;}this.resetClassroomConsent('import');this.pendingImport=null;this.focusCell='0,0';this.reflection={reason:'',revisionCondition:''};this.reflectionAttemptId=null;this.pendingDraft=null;root.clearTimeout(this.draftTimer);this.draftTimer=null;this.draftStatus='';this.finished=null;this.pending=null;this.uiCache=null;this.persist(result);this.profile=this.store.loadProfile().data;this.progress=this.store.loadProgress().data;this.savedSession=this.store.loadSession().data;this.state=null;this.view='home';this.voice.stop();this.clearVoiceCaption();this.music?.setEnabled(this.profile.settings.musicEnabled);this.music?.setVolume(this.profile.settings.musicVolume);this.music?.setScene('briefing');this.closeDialog();this.applyPreferences();this.render();this.toast(result.persisted?'新版備份已驗證並匯入。':'備份已載入本頁，但尚未保存，請下載備份。');}
 journal(){const attempts=this.store.loadAttempts().data.filter(a=>a.learning);this.openDialog('你的學習紀錄',attempts.length?'<p>'+(this.formal?'此頁顯示本機學習反思。班級收件狀態請看同步面板；已收件仍待教師核實，不自動算出席。':'以下只包含這個瀏覽器的新版反思，不代表正式點名。')+'</p><ul class="journal-list">'+attempts.slice().reverse().map(a=>'<li><strong>'+escape(M().getMission(a.chapterId)?.title||a.chapterId)+'</strong><small>'+escape(a.closedAt.slice(0,16).replace('T',' '))+' · 裝置時間 · '+(a.battle.status==='won'?'任務達成':'演訓結束')+'</small><p>理由：'+escape(a.learning.reason)+'</p><p>調整條件：'+escape(a.learning.revision)+'</p></li>').join('')+'</ul>':'<p>還沒有新版學習紀錄。完成一場演訓，再填寫兩欄反思，就會出現在這裡。</p>','LOCAL LEARNING JOURNAL');}
 log(){this.openDialog('這一場的行動紀錄','<ul class="journal-list">'+(this.state?.log.length?this.state.log.slice().reverse().map(e=>'<li>'+escape(typeof e==='string'?e:e.message||e.type)+'<small>回合 '+escape(e.round||'')+'</small></li>').join(''):'<li>還沒有行動。選擇一位隊員，踏出第一步。</li>')+'</ul>','ACTION LOG');}
 setDraftStatus(message){this.draftStatus=message;const node=root.document.getElementById('reflection-draft-status');if(node)node.textContent=message;}
 scheduleDraft(){if(this.finished||this.view!=='result'||!this.reflectionAttemptId)return;root.clearTimeout(this.draftTimer);const pending={attemptId:this.reflectionAttemptId,draft:{reason:this.reflection.reason,revisionCondition:this.reflection.revisionCondition}};this.pendingDraft=pending;this.setDraftStatus('正在保存這一場的草稿…');this.draftTimer=root.setTimeout(()=>this.flushDraft(pending),400);}
 flushDraft(expected=null){if(expected&&expected!==this.pendingDraft)return {ok:true,skipped:true};root.clearTimeout(this.draftTimer);this.draftTimer=null;const pending=this.pendingDraft;this.pendingDraft=null;if(!pending||typeof this.store.saveDraft!=='function')return {ok:true,skipped:true};const current=this.store.loadSession();if(!pending.attemptId||pending.attemptId!==this.reflectionAttemptId||current.attemptId!==pending.attemptId)return {ok:true,skipped:true};const result=this.store.saveDraft(pending.attemptId,pending.draft);if(result.code==='draft-stale')return result;this.persist(result);this.setDraftStatus(result.ok?(result.persisted?'草稿已儲存在此瀏覽器，尚未完成學習紀錄。':'草稿暫留本頁記憶體，請下載備份。'):(result.message||'草稿尚未保存，請保留目前文字。'));return result;}
 finishReflection(){if(!this.requireChapter(this.state?.missionId))return;if(this.finished)return;const form=root.document.getElementById('reflection-form'),reason=form.elements.reason.value.trim(),revisionCondition=form.elements.revisionCondition.value.trim();this.reflection={reason,revisionCondition};if(!reason||!revisionCondition){root.document.getElementById('reflection-error').innerHTML='<p class="inline-error" role="alert">兩欄都需要填寫。請寫下理由，以及會讓你調整的新資訊。</p>';(!reason?form.elements.reason:form.elements.revisionCondition).focus();return;}this.pendingDraft={attemptId:this.reflectionAttemptId,draft:{...this.reflection}};this.flushDraft();const saved=this.saveSession();if(!saved?.ok){root.document.getElementById('reflection-error').innerHTML='<p class="inline-error" role="alert">'+escape(saved?.message||'終局尚未保存，請先下載備份。')+'</p>';return;}const result=this.store.finishAttempt(this.state,this.reflection);if(!result.ok){root.document.getElementById('reflection-error').innerHTML='<p class="inline-error" role="alert">'+escape(result.message)+'</p>';return;}this.finished=result;this.pendingDraft=null;root.clearTimeout(this.draftTimer);this.draftTimer=null;this.draftStatus='';this.persist(result);this.savedSession=null;this.progress=this.store.loadProgress().data;this.render();this.toast(result.persisted?'兩欄反思已核對並儲存在此瀏覽器。':'反思暫留本頁記憶體，請下載備份。');}
 bonus(chapterId=this.state?.missionId||'u03'){if(!this.requireChapter(chapterId))return;if(!root.RPGBonus||!root.RPGBonusContent){this.toast('支線資料尚未載入，主線仍可繼續。');return;}this.bonusChapter=chapterId;const chapter=root.RPGBonusContent.getChapter(chapterId),state=this.store.loadBonus().data,summary=root.RPGBonus.getSummary(state,chapterId);this.openDialog('課後小徑 · '+chapter.title,'<label class="form-label" for="bonus-chapter">選擇支線章節</label><select id="bonus-chapter">'+M().missions.map(m=>'<option value="'+m.id+'" '+(m.id===chapterId?'selected':'')+'>第 '+m.number+' 章 · '+escape(m.chapterTitle)+'</option>').join('')+'</select><p class="form-help" style="margin:12px 0 17px">可略過的獨立練習與彩蛋，不影響戰棋、反思或出席。</p><div class="puzzle-list">'+chapter.markers.map(marker=>'<button type="button" class="puzzle-row" data-action="bonus-marker" data-marker="'+marker.id+'">'+ico(marker.kind==='easterEgg'?'spark':'book')+'<span><h3>'+escape(marker.name)+'</h3><p>'+escape(marker.description)+'</p></span><span class="tag gold">'+(marker.kind==='easterEgg'?'收藏':'益智')+'</span></button>').join('')+'</div><div class="tip-card"><h3>'+ico('bag')+' 探索成果</h3><p>這裡只記錄探索與解謎。提示、重試都不扣除主線完成。</p></div>','OPTIONAL SIDE STORIES');}
 bonusMarker(id){if(!this.requireChapter(this.bonusChapter))return;const chapter=root.RPGBonusContent.getChapter(this.bonusChapter),marker=chapter.markers.find(m=>m.id===id);if(!marker)return;const state=this.store.loadBonus().data,result=root.RPGBonus.interact(state,this.bonusChapter,id,{id:this.bonusEventId('interact'),token:state.revision});if(!result.ok){this.toast(result.feedback?.text||'支線尚未完成。');return;}this.persist(this.store.saveBonus(result.state));if(marker.puzzleId){this.puzzleStory=marker.story;this.puzzle(marker.puzzleId);return;}this.openDialog(marker.name,'<p>'+escape(marker.story)+'</p><div class="puzzle-feedback">'+escape(marker.reward.label)+'</div><div class="dialog-actions">'+button('回到課後小徑','bonus','primary')+'</div>','A LITTLE DISCOVERY');}
 bonusEventId(type){return 'tactical-'+type+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
 puzzle(id,feedback='',draft=null){const chapter=root.RPGBonusContent.getChapter(this.bonusChapter),p=chapter.puzzles.find(p=>p.id===id);if(!p)return;this.puzzleId=id;let controls='';if(p.kind==='evidence-sort')controls=p.cards.map(c=>'<label class="puzzle-select-row" for="puzzle-'+c.id+'"><span>'+escape(c.label)+'</span><select id="puzzle-'+c.id+'" name="'+c.id+'" required><option value="">請選擇</option>'+p.categories.map(cat=>'<option value="'+cat.id+'" '+(draft?.[c.id]===cat.id?'selected':'')+'>'+escape(cat.label)+'</option>').join('')+'</select></label>').join('');else if(p.kind==='dependency-order')controls=p.cards.map((c,i)=>'<label class="puzzle-select-row" for="puzzle-order-'+i+'"><span>第 '+(i+1)+' 步</span><select id="puzzle-order-'+i+'" name="step-'+i+'" required><option value="">請選擇</option>'+p.cards.map(c=>'<option value="'+c.id+'" '+(draft?.[i]===c.id?'selected':'')+'>'+escape(c.label)+'</option>').join('')+'</select></label>').join('');else controls='<div class="briefing-aside"><h3>準備格上限：'+p.budget.preparation+'</h3><p>必要需求：'+p.requirements.map(r=>escape(r.label)).join('、')+'</p></div>'+p.choices.map(c=>'<label class="puzzle-choice"><input type="checkbox" name="choice" value="'+c.id+'" '+(draft?.includes(c.id)?'checked':'')+'><span>'+escape(c.label)+' · '+c.cost.preparation+' 格<br><small>'+c.covers.map(id=>escape(p.requirements.find(r=>r.id===id)?.label||id)).join('、')+'</small></span></label>').join('');this.openDialog(p.title,(this.puzzleStory?'<p>'+escape(this.puzzleStory)+'</p>':'')+'<p>'+escape(p.prompt)+'</p><p class="form-help">'+escape(p.instructions)+'</p><form id="puzzle-form"><div class="puzzle-choices">'+controls+'</div>'+(feedback?'<div class="puzzle-feedback" role="status">'+feedback+'</div>':'')+'<div class="dialog-actions">'+button('需要一點提示','puzzle-hint','outline')+'<button type="submit" class="button primary">核對安排 '+ico('check')+'</button></div></form><div class="dialog-actions">'+button('回到課後小徑','bonus','subtle')+'</div>','A DIFFERENT WAY TO THINK');}
 puzzleDraft(){const form=root.document.getElementById('puzzle-form'),p=root.RPGBonusContent.getChapter(this.bonusChapter).puzzles.find(p=>p.id===this.puzzleId);if(!form)return null;if(p.kind==='evidence-sort')return Object.fromEntries(p.cards.map(c=>[c.id,form.elements[c.id].value]));if(p.kind==='dependency-order')return p.cards.map((_,i)=>form.elements['step-'+i].value);return Array.from(form.querySelectorAll('input:checked')).map(i=>i.value);}
 puzzleAnswer(hint=false){if(!this.requireChapter(this.bonusChapter))return;const draft=this.puzzleDraft(),state=this.store.loadBonus().data,meta={id:this.bonusEventId(hint?'hint':'answer'),token:state.revision};const result=hint?root.RPGBonus.hint(state,this.bonusChapter,this.puzzleId,meta):root.RPGBonus.answer(state,this.bonusChapter,this.puzzleId,draft,meta);if(result.state)this.persist(this.store.saveBonus(result.state));const f=result.feedback||{},feedback='<strong>'+escape(f.title||'核對結果')+'</strong><p>'+escape(f.text||'')+'</p>'+(f.details?.length?'<ul>'+f.details.map(d=>'<li>'+escape(d)+'</li>').join('')+'</ul>':'');this.puzzle(this.puzzleId,feedback,draft);}
 navigate(view){if(this.busy){this.toast('這個行動完成後就能切換畫面。');return;}this.flushDraft();this.view=view;this.pending=null;this.closeDialog();this.music?.setScene('briefing');this.render();root.scrollTo?.({top:0});}
 click(event){const cell=event.target.closest?.('[data-cell]');if(cell&&this.root.contains(cell)){const [x,y]=cell.dataset.cell.split(',').map(Number);this.activateSound();this.tileClick(x,y);return;}const b=event.target.closest?.('[data-action]');if(!b||b.disabled)return;this.activateSound();const action=b.dataset.action;if(this.busy&&!['music','help','close-dialog','intents'].includes(action)){this.toast('正在完成已確認的行動，稍候就能繼續。');return;}try{switch(action){case'home':this.navigate('home');break;case'chapters':this.navigate('chapters');break;case'briefing':this.briefing(b.dataset.mission);break;case'continue':this.continue();break;case'decision':this.briefing(this.briefingId,b.dataset.decision);break;case'start':this.start();break;case'select-unit':this.selectUnit(b.dataset.unit);break;case'mode':this.setMode(b.dataset.mode);break;case'cancel-action':this.pending=null;this.render();break;case'confirm-action':if(this.pending){if(this.pending.command.type==='endTurn'){this.pending=null;this.endTurn();}else this.execute(this.pending.command);}break;case'end-turn':this.endTurn();break;case'confirm-end-turn':this.closeDialog();this.execute({type:'endTurn',revision:this.state.revision});break;case'undo':this.execute({type:'undo',revision:this.state.revision});break;case'intents':this.showIntents=!this.showIntents;this.render();break;case'help':this.help();break;case'coach':this.coach();break;case'coach-preview':this.previewCoach();break;case'coach-disable':this.setCoachPreference(false);this.closeDialog();this.render();this.toast('新手推薦已關閉，可從遊戲設定重新開啟。');break;case'settings-coach':this.setCoachPreference(!this.coachPreference);this.settings();this.render();break;case'objectives':this.objectives();break;case'notes':this.notes();break;case'log':this.log();break;case'menu':this.menu();break;case'classroom':this.openClassroom();break;case'close-dialog':this.closeDialog();break;case'music':this.profile.settings.musicEnabled=!this.profile.settings.musicEnabled;this.music?.setEnabled(this.profile.settings.musicEnabled);this.saveProfile();this.render();this.activateSound();break;case'settings':this.settings();break;case'settings-music':this.profile.settings.musicEnabled=!this.profile.settings.musicEnabled;this.music?.setEnabled(this.profile.settings.musicEnabled);this.saveProfile();this.settings();this.render();this.activateSound();break;case'settings-voice':this.profile.settings.voiceEnabled=!this.profile.settings.voiceEnabled;if(!this.profile.settings.voiceEnabled)this.voice.stop();this.saveProfile();this.settings();break;case'settings-motion':this.profile.settings.reducedMotion=!this.profile.settings.reducedMotion;this.saveProfile();this.settings();break;case'wardrobe':this.wardrobe();break;case'wardrobe-tab':this.wardrobe(b.dataset.role,false);break;case'wardrobe-preset':this.wardrobeDraft[this.wardrobeRole]=clone(root.RPGAvatar.presets.find(p=>p.id===b.dataset.preset).value);this.wardrobeModes[this.wardrobeRole]='custom';this.wardrobe(this.wardrobeRole,false);break;case'wardrobe-original':this.wardrobeModes[this.wardrobeRole]='illustrated';this.wardrobe(this.wardrobeRole,false);break;case'wardrobe-alt':this.wardrobeModes[this.wardrobeRole]='illustrated-alt';this.wardrobe(this.wardrobeRole,false);break;case'wardrobe-custom':this.wardrobeModes[this.wardrobeRole]='custom';this.wardrobe(this.wardrobeRole,false);break;case'wardrobe-save':this.profile.squadAppearance=clone(this.wardrobeDraft);this.profile.squadArtMode=clone(this.wardrobeModes);const saved=this.saveProfile();if(saved.ok){this.closeDialog();this.render();this.preloadPoses();this.toast(saved.persisted?'小隊造型已儲存。':'造型暫留本頁，請下載備份。');}else this.toast(saved.message);break;case'retry':if(!this.state)break;this.briefing(this.state.missionId,this.state.decisionId);break;case'export':this.export();break;case'import':this.importDialog();break;case'confirm-import':this.confirmImport();break;case'journal':this.journal();break;case'bonus':this.bonus(this.bonusChapter||this.state?.missionId||'u03');break;case'bonus-marker':this.bonusMarker(b.dataset.marker);break;case'puzzle-hint':this.puzzleAnswer(true);break;}}catch(error){this.toast('這一步沒有完成：'+error.message);}}
 change(event){const t=event.target;if(t.dataset.appearance){this.wardrobeDraft[this.wardrobeRole][t.dataset.appearance]=t.value;this.wardrobeModes[this.wardrobeRole]='custom';this.refreshWardrobePreview();}else if(t.id==='import-file')this.readImport(t.files[0]);else if(t.id==='bonus-chapter'){this.puzzleStory='';this.bonus(t.value);}else if(['musicVolume','voiceVolume'].includes(t.name)){this.profile.settings[t.name]=Number(t.value);if(t.name==='musicVolume')this.music?.setVolume(Number(t.value)*(this.voice.ducked?.35:1));this.saveProfile();}}
 input(event){const t=event.target;if(t.closest('#reflection-form')&&['reason','revisionCondition'].includes(t.name)){this.reflection[t.name]=t.value;this.scheduleDraft();}if(t.name==='musicVolume'){this.profile.settings.musicVolume=Number(t.value);this.music?.setVolume(Number(t.value)*(this.voice.ducked?.35:1));const label=this.dialog.querySelector('label[for="music-volume"] small');if(label)label.textContent=Math.round(Number(t.value)*100)+'%';}if(t.name==='voiceVolume'){const label=this.dialog.querySelector('label[for="voice-volume"] small');if(label)label.textContent=Math.round(Number(t.value)*100)+'%';}}
 submit(event){event.preventDefault();if(event.target.id==='reflection-form')this.finishReflection();else if(event.target.id==='puzzle-form')this.puzzleAnswer();}
 keydown(event){if(this.view!=='battle'||this.busy||event.altKey||event.ctrlKey||event.metaKey||['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;if(event.key==='Escape'){this.pending=null;this.render();return;}if(['1','2','3'].includes(event.key)){event.preventDefault();this.selectUnit(roleOrder[Number(event.key)-1]);return;}const cell=event.target.closest?.('[data-cell]');if(!cell||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();let [x,y]=cell.dataset.cell.split(',').map(Number);if(event.key==='ArrowUp')y--;if(event.key==='ArrowDown')y++;if(event.key==='ArrowLeft')x--;if(event.key==='ArrowRight')x++;if(event.key==='Home')x=0;if(event.key==='End')x=this.mission.map.width-1;x=Math.max(0,Math.min(x,this.mission.map.width-1));y=Math.max(0,Math.min(y,this.mission.map.height-1));this.focusCell=x+','+y;cell.tabIndex=-1;const next=this.root.querySelector('[data-cell="'+this.focusCell+'"]');next.tabIndex=0;next.focus();}
}
return {App,Voice,bootError,skillIcon,coord};
